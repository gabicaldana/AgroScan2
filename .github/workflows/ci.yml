# O repositorio tem quatro artefatos gerados e versionados: as fixtures do
# motor, as fixtures de pixel e os dois modulos TypeScript. Cada um tem teste
# de frescor, mas ate aqui esses testes so rodavam na maquina de quem lembrasse
# de roda-los. Este workflow e o que torna a promessa real.
#
# A ordem importa: `app.fixtures` roda o motor sobre a base validada, e
# `npm run base` gera os modulos TypeScript a partir dos mesmos JSON.
#
# A checagem final e a que vale: depois de regerar tudo, o diretorio de
# trabalho tem que estar limpo. Se um arquivo gerado mudou, alguem editou uma
# fonte e esqueceu de regerar - e o commit teria entrado com base e artefato
# divergentes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # O motor, a validacao da base e a geracao dos artefatos sao stdlib
      # pura - rodam antes de qualquer instalacao, de proposito. Se um dia
      # este passo precisar de dependencia, e sinal de que algo do back-end
      # vazou para dentro do motor.
      - name: Validar a base e regerar os artefatos
        run: |
          python -m app.validacao
          python -m app.fixtures
          python -m app.preprocessamento

      # requirements-dev.txt, e nao requirements.txt: ele inclui o de producao
      # mais o cliente HTTP que o TestClient do Starlette exige e nao declara.
      # Sem ele, os testes da API se pulam - e um passo verde que nao verificou
      # nada e pior do que um passo vermelho.
      - name: Dependencias do back-end e de teste
        run: pip install -r requirements-dev.txt

      # Os modulos de teste da API se pulam sozinhos quando as dependencias
      # faltam, o que e o comportamento certo no desenvolvimento local e o
      # comportamento ERRADO aqui: no CI, pular e passar sem verificar. Este
      # passo transforma "pulou" em falha alta, antes de a suite rodar.
      - name: Conferir que os testes da API vao rodar, e nao se pular
        run: |
          python - <<'PY'
          import sys
          try:
              from fastapi.testclient import TestClient
              from app.api.principal import app
              TestClient(app)
          except Exception as erro:
              print("Os testes da API NAO rodariam nesta maquina.")
              print(f"{type(erro).__name__}: {erro}")
              print()
              print("A suite se pularia em silencio e o CI ficaria verde sem")
              print("verificar a paridade HTTP nem o contrato do caderno.")
              print("Confira requirements-dev.txt.")
              sys.exit(1)
          print("TestClient operante: os 22 testes da API vao rodar.")
          PY

      # Entre eles esta a paridade HTTP: a resposta de POST /diagnosticos tem
      # que reproduzir as fixtures caso a caso, campo a campo.
      - name: Testes do motor e da API
        run: python -m unittest discover -s tests -t . -v

      - name: Instalar o app
        working-directory: web
        run: npm ci

      - name: Regerar os modulos gerados
        working-directory: web
        run: npm run base

      - name: Testes do porte em TypeScript
        working-directory: web
        run: npm test

      - name: Lint e build
        working-directory: web
        run: |
          npm run lint
          npm run build

      - name: Nenhum artefato gerado ficou para tras
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Artefatos gerados divergem das fontes:"
            git status --porcelain
            git diff
            echo
            echo "Rode: python -m app.validacao && python -m app.fixtures && python -m app.preprocessamento"
            echo "     cd web && npm run base"
            exit 1
          fi
